server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: power-duel-backend

  datasource:
    url: jdbc:h2:file:./data/power-duel;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${app.base-url}/login/oauth2/code/google

# The public URL this app is reachable at - defined once here, and reused
# below (and in the Google redirect-uri above) so it only needs updating
# in one place if the domain or port ever changes.
app:
  base-url: *** put in your site ***
  frontend-success-redirect: ${app.base-url}/